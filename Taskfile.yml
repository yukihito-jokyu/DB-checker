version: "3"

tasks:
  install:
    desc: frontend の依存関係をインストールする
    dir: frontend
    cmds:
      - npm install

  generate:
    desc: Wails の frontend binding を生成する
    cmds:
      - wails generate module
      # Wails v2.10.1 は models.ts の空行にタブを出力し、runtime を実行可能にコピーするため正規化する。
      - perl -pi -e 's/[ \t]+$//' frontend/wailsjs/go/models.ts
      - chmod 644 frontend/wailsjs/runtime/package.json frontend/wailsjs/runtime/runtime.d.ts frontend/wailsjs/runtime/runtime.js

  test:
    desc: Go のテストを実行する
    cmds:
      - GOCACHE={{.TASKFILE_DIR}}/.cache/go-build go test ./...

  test:style:
    desc: Go テストの複合リテラル改行規約を検査する
    cmds:
      - GOCACHE={{.TASKFILE_DIR}}/.cache/go-build go run .agents/skills/go-test-style/scripts/check_test_literal_layout.go -baseline .agents/skills/go-test-style/scripts/test-literal-layout.baseline .

  test:style:baseline:
    desc: Go テストの複合リテラル改行baselineを更新する
    cmds:
      - GOCACHE={{.TASKFILE_DIR}}/.cache/go-build go run .agents/skills/go-test-style/scripts/check_test_literal_layout.go -baseline .agents/skills/go-test-style/scripts/test-literal-layout.baseline -write-baseline .

  test:policy:scripts:
    desc: Go テスト規約検査スクリプトのテストと関数coverage検査を実行する
    cmds:
      - mkdir -p coverage
      - GOCACHE={{.TASKFILE_DIR}}/.cache/go-build go test .agents/skills/go-test-style/scripts/check_test_literal_layout.go .agents/skills/go-test-style/scripts/check_test_literal_layout_test.go -coverprofile=coverage/test-literal-layout-script.out
      - >-
        GOCACHE={{.TASKFILE_DIR}}/.cache/go-build go run .agents/skills/go-test-style/scripts/check_go_coverage.go
        -profile coverage/test-literal-layout-script.out
        .agents/skills/go-test-style/scripts/check_test_literal_layout.go:main:100
        .agents/skills/go-test-style/scripts/check_test_literal_layout.go:runLayoutCheck:100
        .agents/skills/go-test-style/scripts/check_test_literal_layout.go:collectViolations:100
        .agents/skills/go-test-style/scripts/check_test_literal_layout.go:collectTestFiles:100
        .agents/skills/go-test-style/scripts/check_test_literal_layout.go:ignoredDirectory:100
        .agents/skills/go-test-style/scripts/check_test_literal_layout.go:inspectTestFile:100
        .agents/skills/go-test-style/scripts/check_test_literal_layout.go:inspectNode:100
        .agents/skills/go-test-style/scripts/check_test_literal_layout.go:literalSignature:100
        .agents/skills/go-test-style/scripts/check_test_literal_layout.go:saveBaseline:100
        .agents/skills/go-test-style/scripts/check_test_literal_layout.go:loadBaseline:100
        .agents/skills/go-test-style/scripts/check_test_literal_layout.go:compareBaseline:100
      - GOCACHE={{.TASKFILE_DIR}}/.cache/go-build go test .agents/skills/go-test-style/scripts/check_go_coverage.go .agents/skills/go-test-style/scripts/check_go_coverage_test.go -coverprofile=coverage/test-coverage-script.out
      - >-
        GOCACHE={{.TASKFILE_DIR}}/.cache/go-build go run .agents/skills/go-test-style/scripts/check_go_coverage.go
        -profile coverage/test-coverage-script.out
        .agents/skills/go-test-style/scripts/check_go_coverage.go:main:100
        .agents/skills/go-test-style/scripts/check_go_coverage.go:runCoverageCheck:100
        .agents/skills/go-test-style/scripts/check_go_coverage.go:loadCoverageProfile:100
        .agents/skills/go-test-style/scripts/check_go_coverage.go:parseCoverageBlock:100
        .agents/skills/go-test-style/scripts/check_go_coverage.go:parsePositionLine:100
        .agents/skills/go-test-style/scripts/check_go_coverage.go:parseCoverageTarget:100
        .agents/skills/go-test-style/scripts/check_go_coverage.go:coverageTarget.resolveFunction:100
        .agents/skills/go-test-style/scripts/check_go_coverage.go:coverageFunctionName:100
        .agents/skills/go-test-style/scripts/check_go_coverage.go:receiverName:100
        .agents/skills/go-test-style/scripts/check_go_coverage.go:calculateCoverage:100
        .agents/skills/go-test-style/scripts/check_go_coverage.go:sameCoverageFile:100
        .agents/skills/go-test-style/scripts/check_go_coverage.go:hasUnreachableComment:100

  test:coverage:
    desc: Go の単体テストカバレッジ HTML を生成する
    cmds:
      - mkdir -p coverage
      - GOCACHE={{.TASKFILE_DIR}}/.cache/go-build go test ./... -coverprofile=coverage/coverage.out
      - GOCACHE={{.TASKFILE_DIR}}/.cache/go-build go tool cover -html=coverage/coverage.out -o coverage/coverage.html

  test:coverage:check:
    desc: 指定した Go 関数の単体テストカバレッジを検査する
    requires:
      vars: [TARGETS]
    vars:
      PACKAGES: '{{default "./..." .PACKAGES}}'
    cmds:
      - mkdir -p coverage
      - GOCACHE={{.TASKFILE_DIR}}/.cache/go-build go test {{.PACKAGES}} -coverprofile=coverage/targeted.out
      - GOCACHE={{.TASKFILE_DIR}}/.cache/go-build go run .agents/skills/go-test-style/scripts/check_go_coverage.go -profile coverage/targeted.out {{.TARGETS}}

  format:
    desc: Go ファイルを gofmt で整形する
    cmds:
      - gofmt -w .

  format:check:
    desc: Go ファイルが gofmt 済みか確認する
    cmds:
      - |
        files="$(gofmt -l .)"
        if [ -n "$files" ]; then
          echo "$files"
          exit 1
        fi

  lint:
    desc: Go の lint を golangci-lint で実行する
    cmds:
      - GOCACHE={{.TASKFILE_DIR}}/.cache/go-build GOLANGCI_LINT_CACHE={{.TASKFILE_DIR}}/.cache/golangci-lint golangci-lint run

  backend:check:
    desc: Go backend の format / lint / test を実行する
    cmds:
      - task: format:check
      - task: test:style
      - task: test:policy:scripts
      - task: lint
      - task: test

  integration:up:
    desc: 結合テスト用 DB を起動する
    cmds:
      - docker compose -f docker-compose.integration.yml up -d --wait

  integration:test:
    desc: 実 DB を使う Go 結合テストを実行する
    env:
      DB_CHECKER_INTEGRATION_MYSQL_DSN: db_checker:db_checker@tcp(127.0.0.1:13306)/db_checker_integration?parseTime=true
      DB_CHECKER_INTEGRATION_MYSQL_ADMIN_DSN: root:db_checker_root@tcp(127.0.0.1:13306)/?parseTime=true
      DB_CHECKER_INTEGRATION_POSTGRES_DSN: postgres://db_checker:db_checker@127.0.0.1:15432/db_checker_integration?sslmode=disable
    cmds:
      - GOCACHE={{.TASKFILE_DIR}}/.cache/go-build go test -tags=integration ./...

  integration:down:
    desc: 結合テスト用 DB を停止する
    cmds:
      - docker compose -f docker-compose.integration.yml down

  frontend:build:
    desc: frontend をビルドする
    dir: frontend
    cmds:
      - npm run build

  frontend:check:
    desc: frontend の Biome check を実行する
    dir: frontend
    cmds:
      - npm run check

  frontend:lint:
    desc: frontend の lint を実行する
    dir: frontend
    cmds:
      - npm run lint

  frontend:format:
    desc: frontend の format を実行する
    dir: frontend
    cmds:
      - npm run format

  frontend:storybook:
    desc: Storybook 開発サーバーを起動する
    dir: frontend
    cmds:
      - npm run storybook

  frontend:storybook:build:
    desc: Storybook の静的成果物をビルドする
    dir: frontend
    cmds:
      - npm run build-storybook

  frontend:storybook:test:
    desc: Storybook の描画・操作・アクセシビリティテストを実行する
    dir: frontend
    cmds:
      - npm run test-storybook

  frontend:e2e:
    desc: Wails 経由のPlaywright E2Eテストを実行する
    dir: frontend
    cmds:
      - npm run test:e2e

  dev:
    desc: Wails 開発サーバーを起動する
    cmds:
      - wails dev
